<script>
const ALL=[{"num":1,"title":"鸡场街的过去","subtitle":"从繁华到没落，再到恢复","passage":"那条古老街道，是当时华人迁居南洋最早的落脚处。他们在那里生活、聚居、落地生根。打从上世纪九十年代开始，这条街走向没落。当地人大批涌向新区，造成老街区人去楼空，也一并带走了昔日的繁华景象。近年来，当地政府与人民携手改造老街，使它恢复欣欣向荣的景象。","vocab":["聚居","繁华","没落","恢复"],"vocabQs":[{"type":"image","word":"聚居","q":"哪一个词最适合这张图？","options":["聚居","没落","竞争","咀嚼"],"ans":0,"exp":"许多人长期住在同一个地方，叫“聚居”。"},{"type":"meaning","word":"繁华","q":"“繁华”的意思最接近哪一项？","options":["冷清衰败","热闹兴盛","慢慢离开","重新建立"],"ans":1,"exp":"“繁华”表示地方热闹、兴盛。"},{"type":"context","word":"没落","q":"句子“老街区人去楼空，也带走了昔日的繁华景象”最能说明哪个词？","options":["恢复","聚居","没落","核心"],"ans":2,"exp":"人少、商店冷清，显示老街正在“没落”。"},{"type":"context","word":"恢复","q":"“经过改造，老街又变得热闹起来。”这里的“又变得”最接近哪个词？","options":["竞争","恢复","售卖","聚居"],"ans":1,"exp":"“恢复”是回到原来或较好的状态。"}],"compQs":[{"q":"老街区为什么从上世纪九十年代开始走向没落？","options":["游客太多","当地人大批涌向新区","没有华人居住","政府关闭夜市"],"ans":1,"exp":"文中直接说明，当地人大批涌向新区，造成老街区人去楼空。"},{"q":"“人去楼空”在这段话中说明什么？","options":["房子变高了","街上越来越拥挤","许多人已经离开老街区","商店全部装修"],"ans":2,"exp":"“人去楼空”说明原来住在那里的人离开了。"},{"q":"政府与人民合作改造老街后，最直接的结果是什么？","options":["恢复欣欣向荣","更多人搬去新区","古楼全部拆除","没有游客到来"],"ans":0,"exp":"改造后，老街恢复欣欣向荣的景象。"},{"q":"这段内容的发展顺序最正确的是哪一项？","options":["没落→聚居→恢复→繁华","聚居与繁华→没落→合作改造→恢复","恢复→没落→繁华→聚居","合作改造→没落→聚居→恢复"],"ans":1,"exp":"课文先写过去的聚居与繁华，再写没落，最后写改造与恢复。"}],"touchWrite":[{"type":"fill","q":"选择正确词卡填空：过去许多华人在这里生活、______、落地生根。","options":["聚居","没落","竞争","咀嚼"],"answer":"聚居","exp":"“聚居”表示许多人长期住在同一个地方。"},{"type":"order_words","q":"把词卡排列成完整句子。","cards":["所以","老街","因为","居民迁往新区，","走向没落。"],"answer":["因为","居民迁往新区，","所以","老街","走向没落。"],"exp":"要用“因为……所以……”清楚说明原因和结果。"}]},{"num":2,"title":"鸡场街的改变","subtitle":"文化、夜市与重新焕发活力","passage":"经过改造的老街恢复欣欣向荣。结合中式南洋建筑风格的古楼处处可见。每逢华人节庆，这儿张灯结彩，迎来龙狮表演。特定的日子还经营夜市，摆卖地道美食、精美手工艺品和闻名土产，街上熙来攘往。","vocab":["恢复","土产","张灯结彩","熙来攘往"],"vocabQs":[{"type":"image","word":"土产","q":"图中售卖当地水果和食品，最适合哪个词？","options":["土产","核心","竞争","毅力"],"ans":0,"exp":"“土产”指一个地方出产的特色产品。"},{"type":"meaning","word":"张灯结彩","q":"“张灯结彩”最常用来形容什么情境？","options":["节庆时挂灯笼和彩饰","街道冷清无人","学生认真读书","商人互相竞争"],"ans":0," 子不愿介绍"],"ans":1,"exp":"作者观察到榴梿泡芙似乎特别受欢迎。"},{"q":"年轻小伙子认为榴梿泡芙有什么特点？","options":["口感细滑","非常苦涩","很难咀嚼","没有人喜欢"],"ans":0,"exp":"他直接说榴梿泡芙咀嚼起来口感细滑。"},{"q":"“口沫横飞、滔滔不绝”表现年轻小伙子怎样的状态？","options":["害怕沉默","对产品熟悉而且说得很投入","完全没有信心","准备离开"],"ans":1,"exp":"这两个词都表现他说得兴奋、投入、很有话可说。"},{"q":"作者问“竞争那么大，生意经营得下去吗？”主要担心什么？","options":["同类摊位多会影响生意","夜市没有任何游客","榴梿不能食用","街上没有摊位"],"ans":0,"exp":"同类摊位很多，作者担心竞争会使生意难以经营。"}],"touchWrite":[{"type":"fill","q":"选择最合适的词卡填空：年轻小伙子在______榴梿泡芙。","options":["售卖","恢复","聚居","赐"],"answer":"售卖","exp":"“售卖”就是出售商品。"},{"type":"order_words","q":"把词卡排列成一句介绍榴梿泡芙的话。","cards":["口感细滑，","榴梿泡芙","很受游客欢迎。","咀嚼起来"],"answer":["榴梿泡芙","咀嚼起来","口感细滑，","很受游客欢迎。"],"exp":"先说主语“榴梿泡芙”，再说明口感，最后补充受欢迎的情况。"}]},{"num":4,"title":"年轻人的梦想","subtitle":"良性竞争、毅力与正能量","passage":"年轻小伙子说：“榴梿广受青睐，市场潜力大。大伙儿以和为贵，良性竞争，反而相得益彰。相信只要有毅力，真金不怕火炼。”他信心满满的话语直击作者心田。作者认为鸡场街的烘烤炉，热气腾腾地飘送着各族年轻企业家的梦想。","vocab":["毅力","梦想家","赐","相得益彰","核心"],"vocabQs":[{"type":"meaning","word":"毅力","q":"哪一种行为最能表现“毅力”？","options":["遇到困难马上放弃","每天练习，失败后继续尝试","只做最容易的事","看到别人成功就生气"],"ans":1,"exp":"“毅力”是坚持到底、不轻易放弃的力量。"},{"type":"meaning","word":"相得益彰","q":"“相得益彰”在课文中的意思最接近哪一项？","options":["互相破坏","互相配合，使双方更好","各做各的，毫无关系","一方完全取代另一方"],"ans":1,"exp":"“相得益彰”表示彼此配合，双方的优点更明显。"},{"type":"context","word":"赐","q":"“榴梿是上天赐给我们的果王。”句中的“赐”最接近什么？","options":["给予","争夺","售卖","恢复"],"ans":0,"exp":"“赐”在这里是“给予”的意思。"},{"type":"depth","word":"核心","q":"“世界文化遗产核心区”的“核心”表示什么？","options":["最主要、最重要的部分","最远的地方","临时摊位","一种食物"],"ans":0,"exp":"“核心”指中心、最重要的部分。"}],"compQs":[{"q":"年轻小伙子为什么不害怕同类摊位的竞争？","options":["因为完全没有竞争者","因为他认为市场潜力大，并重视良性竞争","因为游客只能买他的产品","因为他准备停止营业"],"ans":1,"exp":"他认为榴梿市场潜力大，而且大家以和为贵、良性竞争。"},{"q":"“良性竞争，反而相得益彰”告诉我们什么？","options":["竞争一定会造成冲突","合作与健康竞争可以让彼此进步","只有一家店才会成功","做生意不需要努力"],"ans":1,"exp":"健康的竞争可以促使彼此提升，并不一定互相伤害。"},{"q":"作者为什么对年轻小伙子产生激赏之情？","options":["因为他送作者很多食物","因为他充满信心、正能量和毅力","因为他准备离开鸡场街","因为他说话很小声"],"ans":1,"exp":"作者被他充满正能量的话语和坚定态度打动。"},{"q":"“真金不怕火炼”在文中主要强调什么？","options":["真正有能力、有毅力的人经得起考验","所有食物都要用火烧","竞争越多越要生气","梦想不需要行动"],"ans":0,"exp":"这 function restore(){try{let L=ALL[li],d=JSON.parse(localStorage.getItem('BCY5U13_L'+L.num)||'null');if(!d)return;$('name').value=d.name||'';(d.v||[]).forEach((x,i)=>{if(x!=null)document.querySelector(`input[name="v${i}"][value="${x}"]`).checked=true});(d.c||[]).forEach((x,i)=>{if(x!=null)document.querySelector(`input[name="c${i}"][value="${x}"]`).checked=true});if(Array.isArray(d.s)){S=d.s;renderW()}}catch(e){}}
function lvl(x){return x>=90?['🌟','优秀掌握']:x>=75?['👍','掌握良好']:x>=60?['🌱','基本掌握']:['💪','需要再复习']}
function submitQuiz(){let name=$('name').value.trim();if(!name)return alert('请先填写姓名。');let L=ALL[li],vs=0,cs=0,ws=0,d=[];L.vocabQs.forEach((q,i)=>{let a=ch('v'+i),ok=a===q.ans;if(ok)vs+=10;d.push(['词汇',q.q,ok,a==null?'未作答':q.options[a],q.options[q.ans],q.exp])});L.compQs.forEach((q,i)=>{let a=ch('c'+i),ok=a===q.ans;if(ok)cs+=10;d.push(['理解',q.q,ok,a==null?'未作答':q.options[a],q.options[q.ans],q.exp])});L.touchWrite.forEach((t,i)=>{let right=t.answer||t.answers,ok=t.type==='fill'?S[i]===right:eq(S[i],right);if(ok)ws+=10;d.push(['触屏书写',t.q,ok,Array.isArray(S[i])?S[i].join(' → '):(S[i]||'未作答'),Array.isArray(right)?right.join(' → '):right,t.exp])});let total=vs+cs+ws,g=lvl(total);$('meta').textContent=`姓名：${name}　｜　第${L.num}课　｜　${new Date().toLocaleString()}`;$('total').textContent=total+'%';$('grade').textContent=g.join(' ');$('sv').textContent=vs;$('sc').textContent=cs;$('sw').textContent=ws;let need=[];if(vs<32)need.push('重点词汇');if(cs<32)need.push('UASA理解');if(ws<16)need.push('句序与段序');$('fb').innerHTML=`<b>${g[0]} ${g[1]}</b><br>建议复习：${need.length?need.join('、'):'本课掌握良好，可继续挑战下一课。'}`;$('review').innerHTML='<h3>错题与作答回顾</h3>'+d.map(x=>`<details ${!x[2]?'open':''}><summary><span class="${x[2]?'ok':'bad'}">${x[2]?'✓':'✗'} ${x[0]}</span>：${esc(x[1])}</summary><div>你的答案：${esc(x[3])}</div><div>正确答案：${esc(x[4])}</div><div class="note">${esc(x[5])}</div></details>`).join('');$('report').classList.add('show');$('report').scrollIntoView({behavior:'smooth'});localStorage.removeItem('BCY5U13_L'+L.num)}
function retry(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);S=ALL[li].touchWrite.map(t=>t.type==='fill'?null:[]);renderW();$('report').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}init(0);
</script></body></html>
